                        <script>
                            function levenshteinDistance(a, b) {
                                const an = a ? a.length : 0;
                                const bn = b ? b.length : 0;

                                if (an === 0) return bn;
                                if (bn === 0) return an;

                                const matrix = [];

                                for (let i = 0; i <= an; i++) {
                                    matrix[i] = [i];
                                }
                                for (let j = 0; j <= bn; j++) {
                                    matrix[0][j] = j;
                                }

                                for (let i = 1; i <= an; i++) {
                                    for (let j = 1; j <= bn; j++) {
                                        const cost = (a[i - 1] === b[j - 1]) ? 0 : 1;
                                        matrix[i][j] = Math.min(
                                            matrix[i - 1][j] + 1,
                                            matrix[i][j - 1] + 1,
                                            matrix[i - 1][j - 1] + cost
                                        );
                                    }
                                }

                                return matrix[an][bn];
                            }

                            function isKeywordInTitle(query, title) {
                                const titleTokens = title.split(' ');
                                const queryTokens = query.split(' ');
                                return queryTokens.every(queryToken => {
                                    return titleTokens.some(titleToken => {
                                        return levenshteinDistance(queryToken.toLowerCase(), titleToken.toLowerCase().substring(0, queryToken.length)) <= 1;
                                    });
                                });
                            }
